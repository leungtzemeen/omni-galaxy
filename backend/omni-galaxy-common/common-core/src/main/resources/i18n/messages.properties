# =============================================================================
# OmniGalaxy i18n 默认兜底消息（中文）
# 此文件作为 messages_zh_CN.properties 的基准副本，Locale 无匹配时自动降级至此
# =============================================================================

# -----------------------------------------------------------------------------
# ResultCodeEnum 反向桥接 key（命名规则：code.{enum.name()}）
# GlobalExceptionHandler 以此 key 查表；查不到时直接使用枚举自带的中文 msg 兜底
# -----------------------------------------------------------------------------
code.SUCCESS=操作成功
code.FAILED=系统未知异常
code.VALIDATE_FAILED=参数校验失败
code.UNAUTHORIZED=请先登录
code.FORBIDDEN=无访问权限，请联系管理员授权
code.TOO_MANY_REQUESTS=发送过于频繁，请 {0} 分钟后再试

# -----------------------------------------------------------------------------
# AuthResultCodeEnum 反向桥接 key
# -----------------------------------------------------------------------------
code.OTP_INVALID=验证码错误或已过期，请重新获取
code.OTP_SCENE_UNSUPPORTED=不支持的验证码场景：{0}
code.PASSWORD_LOGIN_NOT_IMPL=密码登录功能待 Phase 2 实现

# -----------------------------------------------------------------------------
# Bean Validation 校验注解消息 key（命名规则：validation.{domain}.{constraint}）
# 自定义注解默认 message 属性指向此 key，标准注解在 DTO 字段上显式引用
# -----------------------------------------------------------------------------

# 自定义注解
validation.phone.format=手机号必须为 E.164 格式（如 +86 13800138000）
validation.email.format=邮箱格式不正确
validation.password.strength=密码必须为 8-20 位，且同时包含大写字母、小写字母和数字
validation.either.notBlank=指定字段中必须有且只有一个不为空
validation.identifier.matchesType=凭证格式与类型不匹配（PHONE 须为 E.164，EMAIL 须为合法邮箱）

# OtpLoginRequest
validation.otp.code.notBlank=验证码不能为空
validation.otp.code.pattern=验证码必须为 6 位数字
validation.otp.either.phoneOrEmail=手机号和邮箱：必须且只能填写其中一个

# PasswordLoginRequest
validation.account.notBlank=账号不能为空
validation.account.pattern=账号必须为 4-10 位字母或数字
validation.password.notBlank=密码不能为空

# SendCodeRequest
validation.credential.identityType.notBlank=凭证类型不能为空
validation.credential.identifier.notBlank=登录标识不能为空
validation.otp.scene.notBlank=验证码场景不能为空
