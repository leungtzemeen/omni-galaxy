server:
  port: 9100

spring:
  application:
    name: platform-auth
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/omni_galaxy_auth?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  openapi:
    title: OmniGalaxy 认证中心 API
    description: SSO 登录、注册、验证码接口文档（PHONE/EMAIL/PASSWORD/WECHAT）
    version: v1.0.0
    group:
      default:
        group-name: 认证中心
        api-rule: package
        api-rule-resources:
          - com.omnigalaxy.platform.auth.controller

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 用户中心直连地址（Phase 2 本地联调；Phase 3 接入 Nacos 后留空即可由服务发现接管）
platform-user:
  base-url: ${PLATFORM_USER_BASE_URL:http://localhost:9200}

wechat:
  web:
    app-id: ${WECHAT_WEB_APP_ID:PLACEHOLDER}
    app-secret: ${WECHAT_WEB_APP_SECRET:PLACEHOLDER}
  mini:
    app-id: ${WECHAT_MINI_APP_ID:PLACEHOLDER}
    app-secret: ${WECHAT_MINI_APP_SECRET:PLACEHOLDER}

alipay:
  app-id: ${ALIPAY_APP_ID:PLACEHOLDER}
  # RSA2 私钥（PKCS#8，Base64 编码，不含 Header/Footer 行）；生产通过环境变量注入
  private-key: ${ALIPAY_PRIVATE_KEY:PLACEHOLDER}

omni-galaxy:
  security:
    # 仅豁免接口文档路径。/auth/** 不再整体豁免——网关已会在校验通过后透传
    # X-User-Id/X-User-Roles，SecurityInterceptor 需要正常跑通才能让
    # @RequiresLogin/@RequiresRoles 生效（如 /auth/social/bind/state）。
    whitelist:
      - /doc.html
      - /v3/api-docs/**
      - /swagger-ui/**
      - /webjars/**
  jwt:
    # 开发占位密钥，生产环境必须通过 JWT_SECRET 环境变量注入
    # 生成命令：openssl rand -base64 64
    secret: ${JWT_SECRET:ZGV2LW9ubGktc2VjcmV0LWtleS10aGF0LXNob3VsZC1iZS1jaGFuZ2Vk}
    expire-ms: 86400000
