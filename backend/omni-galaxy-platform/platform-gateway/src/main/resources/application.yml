server:
  port: 8080

spring:
  application:
    name: platform-gateway
  data:
    redis:
      # 与 auth:token:blacklist:{jti} / auth:reset:{userId} 同一套 Redis 实例
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      # 全局 CORS：CorsWebFilter 运行在路由/GlobalFilter 链之前，预检 OPTIONS 在此直接应答，
      # 不会触达 JwtVerificationFilter；同时会为所有响应（含 401）补齐 CORS 头。
      globalcors:
        cors-configurations:
          '[/**]':
            # 生产环境通过 CORS_ALLOWED_ORIGINS 注入具体域名（逗号分隔），严禁线上仍用通配符
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # 认证中心：/auth/** 全量转发，lb:// 由 LoadBalancer 实时查询 Nacos 上 platform-auth 的健康实例
        - id: platform-auth
          uri: lb://platform-auth
          predicates:
            - Path=/auth/**

omni-galaxy:
  # 与签发方（platform-auth-biz）共用同一份 JWT_SECRET，否则签名校验必然失败。
  # ⚠️  fallback 仅限本地联调；生产环境必须通过 JWT_SECRET 环境变量注入强随机密钥。
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubGktc2VjcmV0LWtleS10aGF0LXNob3VsZC1iZS1jaGFuZ2Vk}
  gateway:
    security:
      # JwtVerificationFilter 放行名单：命中以下 Ant 路径的请求不做 JWT 校验。
      # 注意：/auth/logout 不在此列——登出本身需要携带（尚未失效的）JWT 才能定位待拉黑的 jti。
      # 已知技术债（Phase 2.5 范围外）：此名单需要随各业务域新增公开接口手动维护，
      # 后续应探索基于路由元数据的声明式方案，避免每次新增公开接口都要改网关配置。
      public-paths:
        - /auth/login/**
        - /auth/register/**
        - /auth/code/send
        - /auth/captcha/image